# Default HTTP vhost. Cloudflare can terminate TLS and forward HTTPS as HTTP
# to origin (not recommended). Prefer Full (strict) + origin certificates.
# See docker/nginx/conf.d/ssl.example.conf

upstream varnarc_web {
  server web:3000;
  keepalive 32;
}

upstream varnarc_admin {
  server admin:3001;
  keepalive 32;
}

upstream varnarc_api {
  server api:4000;
  keepalive 32;
}

server {
  listen 80 default_server;
  server_name _;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 444;
  }
}

# Public site + API prefix on the same host
server {
  listen 80;
  server_name varnarc.com www.varnarc.com;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location /api/v1/ {
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://varnarc_api/api/v1/;
  }

  location /api/v1 {
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://varnarc_api/api/v1;
  }

  location / {
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://varnarc_web;
  }
}

server {
  listen 80;
  server_name admin.varnarc.com;

  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Admin Next.js BFF routes stay on admin; Nest API is also proxied so a
  # relative NEXT_PUBLIC_API_URL=/api/v1 would still work if misconfigured.
  location /api/v1/ {
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://varnarc_api/api/v1/;
  }

  location /api/v1 {
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://varnarc_api/api/v1;
  }

  location / {
    include /etc/nginx/proxy_params.conf;
    proxy_pass http://varnarc_admin;
  }
}
