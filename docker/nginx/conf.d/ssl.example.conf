# OPTIONAL HTTPS origin listeners for Cloudflare SSL mode Full (strict).
# 1. Create a Cloudflare Origin Certificate (not a Cloudflare API token).
# 2. Save as docker/nginx/certs/origin.crt and origin.key (never commit them).
# 3. Rename this file to ssl.conf (or copy the server blocks into varnarc.conf).
# 4. Reload nginx: docker compose -f docker/docker-compose.vps.yml exec nginx nginx -s reload
#
# Do not enable these server blocks until the certificate files exist, or nginx
# will fail to start.

