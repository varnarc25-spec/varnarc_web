<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-label="Loan comparison editorial illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7f9fc"/>
      <stop offset="0.55" stop-color="#f3f6fa"/>
      <stop offset="1" stop-color="#faf6f1"/>
    </linearGradient>
    <linearGradient id="panel" x1="560" y1="220" x2="1040" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#122b4a"/>
    </linearGradient>
    <linearGradient id="cardLift" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1f3a" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1f3a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Soft canvas -->
  <rect width="1600" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="220" cy="170" r="140" fill="#e8eef5" opacity="0.55"/>
  <circle cx="1420" cy="720" r="180" fill="#ffedd5" opacity="0.35"/>
  <circle cx="1380" cy="160" r="90" fill="#e8eef5" opacity="0.4"/>
  <rect x="120" y="680" width="220" height="220" rx="48" fill="#e8eef5" opacity="0.28" transform="rotate(-12 230 790)"/>

  <!-- Left floating loan cards (abstract) -->
  <g filter="url(#softShadowSm)">
    <rect x="150" y="230" width="280" height="168" rx="28" fill="url(#cardLift)" stroke="#e2e8f0"/>
    <circle cx="210" cy="290" r="28" fill="#e8eef5"/>
    <path d="M210 276v28M196 290h28" stroke="#0b1f3a" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <rect x="258" y="276" width="132" height="12" rx="6" fill="#0b1f3a" opacity="0.78"/>
    <rect x="258" y="302" width="92" height="9" rx="4.5" fill="#94a3b8" opacity="0.45"/>
    <rect x="186" y="340" width="168" height="28" rx="10" fill="#fff4eb"/>
    <rect x="202" y="350" width="88" height="8" rx="4" fill="#f97316" opacity="0.75"/>
  </g>

  <g filter="url(#softShadowSm)" opacity="0.92">
    <rect x="190" y="430" width="250" height="148" rx="26" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="244" cy="484" r="24" fill="#0b1f3a" opacity="0.08"/>
    <path d="M232 484h24M244 472v24" stroke="#0b1f3a" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <rect x="286" y="470" width="118" height="11" rx="5.5" fill="#0b1f3a" opacity="0.7"/>
    <rect x="286" y="494" width="78" height="8" rx="4" fill="#94a3b8" opacity="0.4"/>
    <rect x="220" y="528" width="140" height="22" rx="8" fill="#e8eef5"/>
  </g>

  <!-- Right floating loan card -->
  <g filter="url(#softShadowSm)">
    <rect x="1170" y="250" width="270" height="160" rx="28" fill="url(#cardLift)" stroke="#e2e8f0"/>
    <circle cx="1230" cy="308" r="26" fill="#ffedd5"/>
    <path d="M1220 308h20M1230 298v20" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <rect x="1274" y="296" width="126" height="11" rx="5.5" fill="#0b1f3a" opacity="0.75"/>
    <rect x="1274" y="320" width="86" height="8" rx="4" fill="#94a3b8" opacity="0.42"/>
    <rect x="1204" y="356" width="156" height="26" rx="10" fill="#e8eef5"/>
  </g>

  <!-- Central comparison interface -->
  <g filter="url(#softShadow)">
    <rect x="520" y="180" width="560" height="540" rx="36" fill="url(#panel)"/>
    <!-- soft inner highlight -->
    <rect x="540" y="200" width="520" height="500" rx="28" fill="#ffffff" opacity="0.04"/>

    <!-- Header bars -->
    <rect x="580" y="230" width="180" height="14" rx="7" fill="#ffffff" opacity="0.88"/>
    <rect x="580" y="258" width="260" height="10" rx="5" fill="#ffffff" opacity="0.28"/>

    <!-- Three abstract option rows -->
    <g>
      <rect x="580" y="300" width="440" height="72" rx="18" fill="#163255"/>
      <circle cx="620" cy="336" r="18" fill="#0b1f3a"/>
      <circle cx="620" cy="336" r="8" fill="#f97316" opacity="0.9"/>
      <rect x="656" y="322" width="160" height="10" rx="5" fill="#ffffff" opacity="0.75"/>
      <rect x="656" y="344" width="110" height="8" rx="4" fill="#ffffff" opacity="0.28"/>
      <rect x="900" y="322" width="88" height="28" rx="10" fill="#f97316" opacity="0.95"/>
    </g>
    <g>
      <rect x="580" y="392" width="440" height="72" rx="18" fill="#163255"/>
      <circle cx="620" cy="428" r="18" fill="#0b1f3a"/>
      <circle cx="620" cy="428" r="8" fill="#94a3b8" opacity="0.7"/>
      <rect x="656" y="414" width="148" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
      <rect x="656" y="436" width="96" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
      <rect x="900" y="414" width="88" height="28" rx="10" fill="#ffffff" opacity="0.14"/>
    </g>
    <g>
      <rect x="580" y="484" width="440" height="72" rx="18" fill="#163255"/>
      <circle cx="620" cy="520" r="18" fill="#0b1f3a"/>
      <circle cx="620" cy="520" r="8" fill="#64748b" opacity="0.65"/>
      <rect x="656" y="506" width="136" height="10" rx="5" fill="#ffffff" opacity="0.68"/>
      <rect x="656" y="528" width="104" height="8" rx="4" fill="#ffffff" opacity="0.24"/>
      <rect x="900" y="506" width="88" height="28" rx="10" fill="#ffffff" opacity="0.12"/>
    </g>

    <!-- Comparison arrows between rows -->
    <path d="M1048 336v40" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M1040 368l8 10 8-10" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M1048 428v40" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M1040 460l8 10 8-10" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

    <!-- Bottom EMI timeline strip -->
    <rect x="580" y="590" width="440" height="84" rx="18" fill="#0a1a31"/>
    <circle cx="620" cy="632" r="6" fill="#f97316"/>
    <circle cx="700" cy="632" r="5" fill="#ffffff" opacity="0.45"/>
    <circle cx="780" cy="632" r="5" fill="#ffffff" opacity="0.45"/>
    <circle cx="860" cy="632" r="5" fill="#ffffff" opacity="0.45"/>
    <circle cx="940" cy="632" r="5" fill="#ffffff" opacity="0.45"/>
    <path d="M620 632h320" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
    <rect x="608" y="652" width="40" height="6" rx="3" fill="#f97316" opacity="0.8"/>
    <rect x="688" y="652" width="28" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
    <rect x="768" y="652" width="28" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
    <rect x="848" y="652" width="28" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
    <rect x="928" y="652" width="28" height="6" rx="3" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Percentage / rate symbol orb -->
  <g filter="url(#softShadowSm)">
    <circle cx="1180" y="470" r="64" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="1180" y="470" r="48" fill="#e8eef5"/>
    <circle cx="1162" cy="454" r="9" fill="none" stroke="#0b1f3a" stroke-width="4"/>
    <circle cx="1198" cy="486" r="9" fill="none" stroke="#0b1f3a" stroke-width="4"/>
    <path d="M1154 498l52-56" stroke="#f97316" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Repayment calendar -->
  <g filter="url(#softShadowSm)">
    <rect x="1188" y="560" width="168" height="152" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="1188" y="560" width="168" height="36" rx="22" fill="#0b1f3a"/>
    <rect x="1188" y="580" width="168" height="16" fill="#0b1f3a"/>
    <circle cx="1218" cy="578" r="4" fill="#f97316"/>
    <circle cx="1326" cy="578" r="4" fill="#ffffff" opacity="0.5"/>
    <!-- calendar grid dots -->
    <circle cx="1220" cy="628" r="5" fill="#cbd5e1"/>
    <circle cx="1252" cy="628" r="5" fill="#cbd5e1"/>
    <circle cx="1284" cy="628" r="5" fill="#0b1f3a" opacity="0.75"/>
    <circle cx="1316" cy="628" r="5" fill="#cbd5e1"/>
    <circle cx="1220" cy="660" r="5" fill="#cbd5e1"/>
    <circle cx="1252" cy="660" r="5" fill="#f97316"/>
    <circle cx="1284" cy="660" r="5" fill="#cbd5e1"/>
    <circle cx="1316" cy="660" r="5" fill="#cbd5e1"/>
    <circle cx="1220" cy="692" r="5" fill="#cbd5e1"/>
    <circle cx="1252" cy="692" r="5" fill="#cbd5e1"/>
    <circle cx="1284" cy="692" r="5" fill="#cbd5e1"/>
  </g>

  <!-- Category icons row (home, car, education, document) — subtle -->
  <g opacity="0.92">
    <!-- Home -->
    <g filter="url(#softShadowSm)">
      <rect x="470" y="120" width="72" height="72" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M492 156l14-12 14 12v18h-10v-10h-8v10h-10v-18z" fill="#0b1f3a" opacity="0.8"/>
    </g>
    <!-- Car -->
    <g filter="url(#softShadowSm)">
      <rect x="560" y="108" width="72" height="72" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M574 148h10l6-8h16l6 8h8v12h-6a6 6 0 01-12 0h-10a6 6 0 01-12 0h-6v-12z" fill="#0b1f3a" opacity="0.78"/>
      <circle cx="586" cy="160" r="3.5" fill="#f97316"/>
      <circle cx="614" cy="160" r="3.5" fill="#f97316"/>
    </g>
    <!-- Education / graduation -->
    <g filter="url(#softShadowSm)">
      <rect x="968" y="108" width="72" height="72" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
      <path d="M982 142l22-10 22 10-22 10-22-10z" fill="#0b1f3a" opacity="0.8"/>
      <path d="M992 148v12c6 6 16 6 22 0v-12" stroke="#0b1f3a" stroke-width="3" stroke-linecap="round" opacity="0.55" fill="none"/>
      <circle cx="1024" cy="142" r="2.5" fill="#f97316"/>
    </g>
    <!-- Personal finance / document -->
    <g filter="url(#softShadowSm)">
      <rect x="1058" y="120" width="72" height="72" rx="20" fill="#ffffff" stroke="#e2e8f0"/>
      <rect x="1076" y="138" width="36" height="44" rx="6" fill="#e8eef5"/>
      <rect x="1084" y="150" width="20" height="4" rx="2" fill="#0b1f3a" opacity="0.7"/>
      <rect x="1084" y="160" width="16" height="4" rx="2" fill="#94a3b8" opacity="0.7"/>
      <rect x="1084" y="170" width="12" height="4" rx="2" fill="#f97316" opacity="0.8"/>
    </g>
  </g>

  <!-- Soft comparison arrows linking cards into the center -->
  <path d="M430 310 C480 300, 500 320, 520 340" stroke="#0b1f3a" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.28" fill="none"/>
  <path d="M440 480 C490 470, 505 500, 520 520" stroke="#0b1f3a" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.22" fill="none"/>
  <path d="M1170 330 C1120 340, 1100 360, 1080 380" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.35" fill="none"/>

  <!-- Geometric depth accents -->
  <rect x="1320" y="200" width="48" height="48" rx="14" fill="#0b1f3a" opacity="0.06"/>
  <rect x="180" y="600" width="36" height="36" rx="10" fill="#f97316" opacity="0.12"/>
</svg>
